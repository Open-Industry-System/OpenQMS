# Host-installed trusted configuration; never use a PR-provided Compose file.
name: openqms-pr-${PR_NUMBER:?canonical numeric PR required}
x-bounded: &bounded
  restart: unless-stopped
  cpus: 0.5
  mem_limit: 512m
  pids_limit: 128
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  labels: &labels
    openqms.preview.pr: ${PR_NUMBER}
  logging:
    driver: json-file
    options: {max-size: '5m', max-file: '2'}
  networks: [private]
x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://qms:${POSTGRES_PASSWORD:?}@db/qms_preview
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
  SECRET_KEY: ${SECRET_KEY:?}
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?}
  NEO4J_DATABASE: neo4j
  GRAPH_REPOSITORY: neo4j
  TENANT_MODE: single
  E2E_MODE: 'false'
  LLM_PROVIDER: ''
  LLM_API_KEY: ''
  EMBEDDING_PROVIDER: ''
  EMBEDDING_API_KEY: ''
services:
  db:
    <<: *bounded
    image: pgvector/pgvector:pg15
    # postgres entrypoint requires initial privilege to chown its own new volume.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: qms
      POSTGRES_DB: qms_preview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports: ["127.0.0.1:${PREVIEW_DB_PORT:?}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U qms -d qms_preview']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    <<: *bounded
    image: redis:7-alpine
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    command:
      - sh
      - -ec
      - 'umask 077; printf "requirepass %s\n" "$$REDIS_PASSWORD" > /tmp/redis.conf; exec redis-server /tmp/redis.conf'
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20
  neo4j:
    <<: *bounded
    image: neo4j:5-community
    user: neo4j
    mem_limit: 1g
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?}
      NEO4J_server_memory_heap_initial__size: 256M
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 128M
    volumes: [neo4jdata:/data]
    healthcheck:
      test: [CMD-SHELL, 'NEO4J_USERNAME=neo4j NEO4J_PASSWORD="$${NEO4J_AUTH#*/}" cypher-shell "RETURN 1"']
      interval: 10s
      timeout: 10s
      retries: 30
  backend:
    <<: *bounded
    image: ${BACKEND_IMAGE:?immutable image ID required}
    environment: *app-env
    volumes: ["${PREVIEW_INITIALIZER_PATH:?}:/run/openqms-preview-initialize.py:ro"]
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000', --no-proxy-headers]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      neo4j: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
  graph-worker:
    <<: *bounded
    image: ${BACKEND_IMAGE:?immutable image ID required}
    environment: *app-env
    command: [python, -m, app.services.graph_sync_worker]
    depends_on:
      backend: {condition: service_healthy}
  web:
    <<: *bounded
    image: ${WEB_IMAGE:?immutable image ID required}
    volumes:
      - /etc/openqms/preview-Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      private: {}
      edge:
        aliases: ['openqms-pr-${PR_NUMBER}-web']
    depends_on:
      backend: {condition: service_healthy}
networks:
  private:
    internal: true
    labels: *labels
  edge:
    external: true
    name: openqms-preview-edge
volumes:
  pgdata:
    labels: *labels
  neo4jdata:
    labels: *labels
