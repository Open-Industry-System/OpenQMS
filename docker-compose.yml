version: "3.8"

services:
  db:
    build: ./docker/postgres
    environment:
      POSTGRES_USER: qms
      POSTGRES_PASSWORD: qms_dev_2026
      POSTGRES_DB: qms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qms"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://qms:qms_dev_2026@db:5432/qms
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: openqms-local-dev-2026-jwt-signing-key
      ACCESS_TOKEN_EXPIRE_MINUTES: "120"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      BACKEND_URL: http://backend:8000
      VITE_API_BASE_URL: http://backend:8000/api
      VITE_PUBLIC_DEMO_ENABLED: ${VITE_PUBLIC_DEMO_ENABLED:-false}
      VITE_PUBLIC_DEMO_USERNAME: ${VITE_PUBLIC_DEMO_USERNAME:-}
      VITE_PUBLIC_DEMO_PASSWORD: ${VITE_PUBLIC_DEMO_PASSWORD:-}
    depends_on:
      - backend

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/openqms2026
      NEO4J_server_memory_pagecache_size: 128M
      NEO4J_server_memory_heap_initial__size: 256M
      NEO4J_server_memory_heap_max__size: 512M
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p openqms2026 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

  graph-worker:
    build: ./backend
    command: python -m app.services.graph_sync_worker
    depends_on:
      neo4j:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: openqms-local-dev-2026-jwt-signing-key
      DATABASE_URL: postgresql+asyncpg://qms:qms_dev_2026@db:5432/qms
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: openqms2026

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        limits:
          memory: 2G

  # This profile is intentionally not part of normal local startup. It supplies
  # the real, network-only ClamAV daemon used by `make agent-attachment-e2e`.
  agent-attachment-e2e-db:
    build: ./docker/postgres
    profiles: ["agent-attachment-e2e"]
    environment:
      POSTGRES_USER: qms
      POSTGRES_PASSWORD: qms_dev_2026
      POSTGRES_DB: openqms_agent_attachment_test
    volumes:
      - agent_attachment_e2e_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qms -d openqms_agent_attachment_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  clamav:
    image: clamav/clamav:1.4.3_base@sha256:be37f82c9cccf6c2559a44b8fb537e6f11e8547b37988650b169c4540c2f298c
    profiles: ["agent-attachment-e2e"]
    volumes:
      - agent_attachment_clamav_definitions:/var/lib/clamav
      - ./docker/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 90s

  agent-attachment-e2e:
    build: ./backend
    profiles: ["agent-attachment-e2e"]
    command: >-
      /bin/sh -ec 'alembic upgrade head && pytest -q -s tests/e2e/test_agent_task_attachment_process.py'
    environment:
      DATABASE_URL: postgresql+asyncpg://qms:qms_dev_2026@agent-attachment-e2e-db:5432/openqms_agent_attachment_test
      TEST_DATABASE_URL: postgresql+asyncpg://qms:qms_dev_2026@agent-attachment-e2e-db:5432/openqms_agent_attachment_test
      SECRET_KEY: agent-attachment-e2e-secret
      AGENT_TASK_RUNTIME_ENABLED: "true"
      AGENT_TASK_ATTACHMENTS_ENABLED: "true"
      AGENT_TASK_ATTACHMENT_STORAGE_ROOT: /var/lib/openqms/attachments
      AGENT_TASK_ATTACHMENT_CLAMAV_HOST: clamav
      AGENT_TASK_ATTACHMENT_CLAMAV_PORT: "3310"
      AGENT_ATTACHMENT_E2E_STORAGE_ROOT: /var/lib/openqms/attachments
      AGENT_ATTACHMENT_E2E_CLAMAV_HOST: clamav
      AGENT_ATTACHMENT_E2E_CLAMAV_PORT: "3310"
    volumes:
      - agent_attachment_e2e_storage:/var/lib/openqms/attachments
      - agent_attachment_e2e_runtime:/var/run/openqms/agent-attachment-e2e
    depends_on:
      agent-attachment-e2e-db:
        condition: service_healthy
      clamav:
        condition: service_healthy

volumes:
  pgdata:
  neo4j_data:
  ollama_data:
  agent_attachment_e2e_db:
  agent_attachment_e2e_storage:
  agent_attachment_e2e_runtime:
  agent_attachment_clamav_definitions:
