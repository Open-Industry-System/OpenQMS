# ClamAV configuration for the isolated agent-attachment acceptance profile.
# The daemon sees only its definition database: application attachment bytes travel
# over verified newline nINSTREAM framing and are never mounted into this container.
TCPSocket 3310
TCPAddr 0.0.0.0
Foreground yes
LogTime yes
PidFile /tmp/clamd.pid
DatabaseDirectory /var/lib/clamav
StreamMaxLength 20M
MaxScanSize 20M
MaxFileSize 20M
MaxRecursion 10
MaxFiles 1000
MaxScanTime 60000
MaxThreads 1
MaxQueue 1
AlertExceedsMax yes
AlertEncrypted yes
ScanArchive yes
ScanPDF yes
