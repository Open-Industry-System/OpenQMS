# ClamAV configuration for the isolated agent-attachment acceptance profile.
# The daemon sees only its definition database: application attachment bytes travel
# over zINSTREAM and are never mounted into this container.
TCPSocket 3310
TCPAddr 0.0.0.0
Foreground yes
LogTime yes
LogFile /dev/stdout
PidFile /tmp/clamd.pid
DatabaseDirectory /var/lib/clamav
StreamMaxLength 20M
MaxScanSize 1M
MaxFileSize 1M
MaxRecursion 8
AlertExceedsMax yes
AlertEncrypted yes
ScanArchive yes
ScanPDF yes
