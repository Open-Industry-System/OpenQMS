name: "💡 Funktionswünsche und Verbesserungen / Features and improvements"
description: Neue Funktionen oder Verbesserungen an Abläufen, Bedienung oder Performance vorschlagen. / Suggest features or workflow, usability, and performance improvements.
title: "[Enhancement] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **Sie können dieses Issue auf Deutsch oder Englisch einreichen / You may submit this issue in German or English.**

        Danke für Ihren Vorschlag! Bitte prüfen Sie zuerst, ob es bereits passende Issues oder Diskussionen gibt.
        Thanks for your suggestion! Please search existing issues for related discussions first.

        Ein technischer Lösungsvorschlag ist nicht nötig. Beschreiben Sie den Anwendungsfall und das Problem, das gelöst werden soll.
        No technical solution is required. Describe your use case and the problem you want to solve.

        Bitte keine Zugangsdaten, Tokens, Kundendaten oder nicht anonymisierten Qualitätsdaten hochladen.
        Do not share credentials, tokens, customer information, or unsanitized quality records.
  - type: dropdown
    id: suggestion-type
    attributes:
      label: Art des Vorschlags / Suggestion type
      options:
        - Neue Funktion / New feature
        - Prozessverbesserung / Workflow improvement
        - Bedienbarkeit / Usability improvement
        - Performance / Performance improvement
        - Sonstiges / Other
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Betroffenes Modul / Affected module
      placeholder: z. B. FMEA, Produktionslenkungsplan, CAPA / 8D oder „Nicht sicher“ / e.g. FMEA, Control Plan, CAPA / 8D, or “Not sure”
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: Anwendungsfall und Problem / Use case and pain points
      description: Wer hat in welcher Situation welches Problem? Wie wird es heute gelöst und was fehlt? Bitte fiktive oder anonymisierte Beispiele verwenden. / Who encounters this problem, and when? How is it handled today, and what falls short? Use fictional or sanitized examples.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Gewünschte Verbesserung / Proposed improvement
      description: Welches Verhalten soll ergänzt oder geändert werden? Bei Qualitätsnormen bitte Name, Ausgabe und Abschnitt nennen, ohne urheberrechtlich geschützten Text hochzuladen. / What behavior should be added or changed? For quality standards, cite the name, edition, and clause number without uploading copyrighted text.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativen (optional) / Alternatives (optional)
      description: Wurden andere Wege erwogen oder gibt es bereits eine Übergangslösung? / Have you considered alternatives or used any workarounds?
  - type: textarea
    id: acceptance
    attributes:
      label: Abnahmekriterien (optional) / Acceptance criteria (optional)
      description: Welches beobachtbare Ergebnis zeigt, dass die Verbesserung wirkt? Testcode ist nicht nötig. / What observable outcome would demonstrate success? Test code is not required.
      placeholder: "Beispiel: Die Liste der Produktionslenkungspläne lässt sich nach Produktlinie filtern und behält den Filter bei. / Example — filter Control Plans by product line and retain the selected filter."
  - type: textarea
    id: context
    attributes:
      label: Zusatzinformationen (optional) / Additional context (optional)
      description: Anonymisierte Screenshots, Skizzen, verwandte Issues oder Referenzlinks. / Add sanitized screenshots, mockups, related issues, or reference links.
