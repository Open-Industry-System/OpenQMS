name: "🐛 Fehlermeldung / Bug report"
description: Funktionsfehler oder unerwartete Ergebnisse melden. / Report errors or unexpected behavior.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Sie können dieses Issue auf Deutsch oder Englisch einreichen / You may submit this issue in German or English.**

        Danke für die Meldung! Bitte durchsuchen Sie zuerst die vorhandenen Issues, um Duplikate zu vermeiden.
        Thanks for reporting! Please search existing issues to avoid duplicates.

        Bitte keine Zugangsdaten, Tokens, Kundendaten oder nicht anonymisierten Qualitätsdaten hochladen; Screenshots und Logs vorher anonymisieren.
        Do not share credentials, tokens, customer information, or unsanitized quality records. Sanitize screenshots and logs before uploading.

        Bei Sicherheitslücken bitte keine Ausnutzungsdetails oder sensiblen Daten in öffentlichen Issues offenlegen.
        For security vulnerabilities, do not disclose exploit details or sensitive data in public issues.
  - type: input
    id: module
    attributes:
      label: Betroffenes Modul / Affected module
      description: Zum Beispiel FMEA, Produktionslenkungsplan, CAPA / 8D, Lieferantenmanagement, Berechtigungen oder Deployment. / For example, FMEA, Control Plan, CAPA / 8D, supplier management, permissions, or deployment.
      placeholder: Modulname oder „Nicht sicher“ / Module name, or “Not sure”
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problembeschreibung / Problem description
      description: Beschreiben Sie kurz, was passiert ist und wie es Ihre Arbeit beeinträchtigt. / Describe what happened and how it affects your work.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zur Reproduktion / Steps to reproduce
      description: Bitte Voraussetzungen, Benutzerrolle und Schritte angeben, ohne echte Konten oder Geschäftsdaten. / Include prerequisites, user roles, and steps. Do not include real accounts or business data.
      placeholder: |
        1. Benutzerrolle und Seite / User role and page
        2. Ausgeführte Aktion / Action taken
        3. Beobachtetes Problem / Problem observed
        Falls nicht zuverlässig reproduzierbar, bitte Häufigkeit und bekannte Bedingungen angeben.
        If intermittent, describe the frequency and known conditions.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Ergebnis / Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Tatsächliches Ergebnis / Actual behavior
      description: Falls vorhanden, die anonymisierte Fehlermeldung im Wortlaut angeben. / Include the exact error message with sensitive information removed, if available.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version und Umgebung / Version and environment
      description: Bitte Version oder Commit, Deployment-Art, Betriebssystem und Browserversion angeben; Unbekanntes mit „Nicht sicher“ ausfüllen. / Include the version or commit, deployment method, OS, and browser version. Enter “Not sure” for unknown items.
      placeholder: |
        OpenQMS-Version / Version or commit:
        Deployment / Deployment: Docker Compose / Lokale Entwicklung Local development / Sonstiges Other
        Betriebssystem / OS:
        Browser und Version / Browser and version:
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, Logs oder Zusatzinformationen (optional) / Screenshots, logs, or context (optional)
      description: Anonymisierte Logs oder Screenshots sind willkommen; keine vollständigen .env-Dateien, Anfrage-Zugangsdaten oder echten Qualitätsdaten einfügen. / Attach sanitized logs or screenshots. Do not paste complete .env files, request credentials, or real quality records.
