name: "🐛 Bug 反馈"
description: 报告功能异常、报错或不符合预期的结果。
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请先搜索已有 Issue，避免重复提交。
        请勿上传账号密码、Token、客户资料或未脱敏的质量记录；截图和日志也请先脱敏。
        安全漏洞请勿在公开 Issue 中披露利用细节或敏感数据。
  - type: input
    id: module
    attributes:
      label: 所属模块
      description: 例如 FMEA、控制计划、CAPA / 8D、供应商管理、权限或部署。
      placeholder: 模块名称；不确定可填写“不确定”
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 简要描述发生了什么，以及对使用造成的影响。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请说明必要的前置条件、用户角色和操作步骤，不要包含真实账号或业务数据。
      placeholder: |
        1. 使用什么角色，打开哪个页面
        2. 执行什么操作
        3. 出现什么问题
        若无法稳定复现，请说明发生频率和已知条件。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 如有错误提示，请提供脱敏后的原文。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 版本与运行环境
      description: 请尽量提供版本号或 commit、部署方式、操作系统和浏览器版本；无法确定的项可填写“不确定”。
      placeholder: |
        OpenQMS 版本 / commit：
        部署方式：Docker Compose / 本地开发 / 其他
        操作系统：
        浏览器及版本：
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图、日志或补充信息（可选）
      description: 可粘贴脱敏日志或上传截图；请不要粘贴完整 .env、请求凭据或真实质量记录。
