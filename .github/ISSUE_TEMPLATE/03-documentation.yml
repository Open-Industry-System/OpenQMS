name: "📖 Feedback zur Dokumentation / Documentation feedback"
description: Fehlerhafte, fehlende oder unklare Dokumentation melden. / Report incorrect, missing, or unclear documentation.
title: "[Docs] "
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: |
        **Sie können dieses Issue auf Deutsch oder Englisch einreichen / You may submit this issue in German or English.**

        Danke, dass Sie die Dokumentation verbessern! Bitte durchsuchen Sie zuerst die vorhandenen Issues, um Duplikate zu vermeiden.
        Thanks for helping improve the documentation! Please search existing issues to avoid duplicates.

        Bitte keine Zugangsdaten, Tokens, Kundendaten oder nicht anonymisierten Qualitätsdaten hochladen; Konfigurationsbeispiele und Logs vorher anonymisieren.
        Do not share credentials, tokens, customer information, or unsanitized quality records. Sanitize configuration examples and logs before sharing.
  - type: input
    id: location
    attributes:
      label: Fundstelle / Documentation location
      description: Bitte Link oder Dateipfad und möglichst den Abschnitt angeben; bei fehlender Dokumentation vorschlagen, wo sie hingehört. / Provide a link or file path and section if possible. For missing documentation, suggest where it belongs.
      placeholder: z. B. Installationsabschnitt in README.md oder docs/e2e.md / e.g. the installation section in README.md, or docs/e2e.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problembeschreibung / Problem description
      description: Was ist falsch, fehlt oder ist unklar? Wenn eine Anleitung fehlschlug, bitte Dokumentationsstand und fehlgeschlagenen Schritt angeben. / What is incorrect, missing, or unclear? If instructions failed, include the documentation version and the step that failed.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Änderungsvorschlag (optional) / Suggested changes (optional)
      description: Wie sollte die Dokumentation korrigiert oder ergänzt werden? Es genügt auch, nur das Problem zu beschreiben. / How could the documentation be improved? It is fine to report a problem without proposing a fix.
  - type: textarea
    id: context
    attributes:
      label: Zusatzinformationen (optional) / Additional context (optional)
      description: Relevante Versionen, anonymisierte Screenshots, Fehlermeldungen oder Referenzlinks. / Include relevant versions, sanitized screenshots, error messages, or reference links.
