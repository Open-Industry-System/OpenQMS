name: Test OpenQMS

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      OPENQMS_TEST_ARTIFACTS: ${{ github.workspace }}/ci-safe/backend-tests
      OPENQMS_CI_SHA: ${{ github.sha }}
      LLM_PROVIDER: ""
      LLM_API_KEY: ""
      LLM_BASE_URL: ""
      EMBEDDING_PROVIDER: ""
      EMBEDDING_API_KEY: ""
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: qms
          POSTGRES_PASSWORD: qms_dev_2026
          POSTGRES_DB: qms_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --label openqms.ci.run=${{ github.run_id }}
          --label openqms.ci.attempt=${{ github.run_attempt }}
          --label openqms.ci.job=backend-tests
        ports:
          - 5432/tcp

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare verified test database
        env:
          SECRET_KEY: test-secret-key-for-ci-only
          LLM_PROVIDER: ""
          LLM_API_KEY: ""
          LLM_BASE_URL: ""
          EMBEDDING_PROVIDER: ""
          EMBEDDING_API_KEY: ""
          PG15_CONTAINER: ${{ job.services.postgres.id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_JOB: backend-tests
          TEST_DATABASE_URL: postgresql+asyncpg://qms:qms_dev_2026@localhost:${{ job.services.postgres.ports['5432'] }}/qms_test
        run: |
          cd backend
          PYTHONPATH=. python -m tests.ci.prepare_database

      - name: Run manual tests
        env:
          SECRET_KEY: test-secret-key-for-ci-only
        run: |
          cd backend
          PYTHONPATH=. python app/test_schema.py
          PYTHONPATH=. python app/test_spc_engine.py

      - name: Run deterministic backend acceptance
        env:
          SECRET_KEY: test-secret-key-for-ci-only
          LLM_PROVIDER: ""
          LLM_API_KEY: ""
          LLM_BASE_URL: ""
          EMBEDDING_PROVIDER: ""
          EMBEDDING_API_KEY: ""
          PG15_CONTAINER: ${{ job.services.postgres.id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_JOB: backend-tests
          TEST_DATABASE_URL: postgresql+asyncpg://qms:qms_dev_2026@localhost:${{ job.services.postgres.ports['5432'] }}/qms_test
        run: make check-backend

      - name: D8 doc-gate preflight (against migrated test DB)
        # A clean migrated CI DB must report no broken CP lineage. Deployment
        # gating remains the explicit target DATABASE_URL command documented in
        # docs/deployment.md; this check never reads a local environment file.
        env:
          SECRET_KEY: test-secret-key-for-ci-only
          LLM_PROVIDER: ""
          LLM_API_KEY: ""
          LLM_BASE_URL: ""
          EMBEDDING_PROVIDER: ""
          EMBEDDING_API_KEY: ""
          PG15_CONTAINER: ${{ job.services.postgres.id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_JOB: backend-tests
          DATABASE_URL: postgresql+asyncpg://qms:qms_dev_2026@localhost:${{ job.services.postgres.ports['5432'] }}/qms_test
          TEST_DATABASE_URL: postgresql+asyncpg://qms:qms_dev_2026@localhost:${{ job.services.postgres.ports['5432'] }}/qms_test
        run: |
          cd backend
          PYTHONPATH=. python -m app.services.capa_doc_gate_preflight

      - name: Run engine import checks
        env:
          SECRET_KEY: test-secret-key-for-ci-only
        run: |
          cd backend
          PYTHONPATH=. python -c "
          engines = [
              'app.services.spc_calculation_engine',
              'app.services.aql_engine',
              'app.services.grr_engine',
              'app.services.bias_engine',
              'app.services.linearity_engine',
              'app.services.stability_engine',
              'app.services.attribute_engine',
              'app.services.diff_engine',
          ]
          for m in engines:
              __import__(m)
              print(f'{m}: OK')
          print('All engine modules imported successfully')
          "

      - name: Upload actual safe receipts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-evidence
          path: |
            ${{ env.OPENQMS_TEST_ARTIFACTS }}/*-receipt.json
            ${{ env.OPENQMS_TEST_ARTIFACTS }}/*.log
          if-no-files-found: error

  frontend-checks:
    runs-on: ubuntu-latest
    env:
      OPENQMS_TEST_ARTIFACTS: ${{ github.workspace }}/ci-safe/frontend-checks
      OPENQMS_CI_SHA: ${{ github.sha }}
      LLM_PROVIDER: ""
      LLM_API_KEY: ""
      LLM_BASE_URL: ""
      EMBEDDING_PROVIDER: ""
      EMBEDDING_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Validate lockfile and install dependencies
        run: |
          cd frontend
          if [ ! -f package-lock.json ]; then
            echo "frontend lockfile package-lock.json is required for reproducible CI" >&2
            exit 1
          fi
          npm ci

      - name: TypeScript check
        run: |
          cd backend
          PYTHONPATH=. python3 -m tests.ci.acceptance_evidence frontend tsc

      - name: Build check
        run: |
          cd backend
          PYTHONPATH=. python3 -m tests.ci.acceptance_evidence frontend build

      - name: Upload actual safe receipts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-checks-evidence
          path: |
            ${{ env.OPENQMS_TEST_ARTIFACTS }}/*-receipt.json
            ${{ env.OPENQMS_TEST_ARTIFACTS }}/*.log
          if-no-files-found: error

  browser-protection:
    runs-on: ubuntu-24.04
    env:
      OPENQMS_TEST_ARTIFACTS: ${{ github.workspace }}/ci-safe/browser-protection
      OPENQMS_CI_SHA: ${{ github.sha }}
      LLM_PROVIDER: ""
      LLM_API_KEY: ""
      LLM_BASE_URL: ""
      EMBEDDING_PROVIDER: ""
      EMBEDDING_API_KEY: ""
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: qms
          POSTGRES_PASSWORD: qms_dev_2026
          POSTGRES_DB: qms_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --label openqms.ci.run=${{ github.run_id }}
          --label openqms.ci.attempt=${{ github.run_attempt }}
          --label openqms.ci.job=browser-protection
        ports:
          - 5432/tcp
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          if [ ! -f package-lock.json ]; then
            echo "frontend package-lock.json is required for browser protection" >&2
            exit 1
          fi
          npm ci

      - name: Install Chromium
        run: |
          cd frontend
          npx --no-install playwright install --with-deps chromium

      - name: Prepare verified browser database
        env:
          SECRET_KEY: test-secret-key-for-ci-only
          LLM_PROVIDER: ""
          LLM_API_KEY: ""
          LLM_BASE_URL: ""
          EMBEDDING_PROVIDER: ""
          EMBEDDING_API_KEY: ""
          PG15_CONTAINER: ${{ job.services.postgres.id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_JOB: browser-protection
          TEST_DATABASE_URL: postgresql+asyncpg://qms:qms_dev_2026@localhost:${{ job.services.postgres.ports['5432'] }}/qms_test
        run: |
          cd backend
          PYTHONPATH=. python -m tests.ci.prepare_database

      - name: Run deterministic browser protection
        env:
          SECRET_KEY: test-secret-key-for-ci-only
          LLM_PROVIDER: ""
          LLM_API_KEY: ""
          LLM_BASE_URL: ""
          EMBEDDING_PROVIDER: ""
          EMBEDDING_API_KEY: ""
          PG15_CONTAINER: ${{ job.services.postgres.id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_JOB: browser-protection
          TEST_DATABASE_URL: postgresql+asyncpg://qms:qms_dev_2026@localhost:${{ job.services.postgres.ports['5432'] }}/qms_test
        run: make check-browser

      - name: Upload actual safe receipts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-protection-evidence
          path: |
            ${{ env.OPENQMS_TEST_ARTIFACTS }}/*-receipt.json
            ${{ env.OPENQMS_TEST_ARTIFACTS }}/*.log
          if-no-files-found: error

  docs-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      LLM_PROVIDER: ""
      LLM_API_KEY: ""
      LLM_BASE_URL: ""
      EMBEDDING_PROVIDER: ""
      EMBEDDING_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify docs updated alongside code changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          if echo "$LABELS" | grep -q '"docs-not-needed"'; then
            echo "PR has 'docs-not-needed' label — skipping docs check."
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED"
          echo "---"

          CODE=$(echo "$CHANGED" | grep -E '^(backend/app/|frontend/src/|docker-compose\.ya?ml$|(^|.*/)Dockerfile($|\..*)|\.github/workflows/|Makefile$|backend/tests/|frontend/e2e/|frontend/.*playwright.*\.ts$)' || true)
          DOCS=$(echo "$CHANGED" | grep -E '^(docs/|AGENTS\.md$|README\.md$|.*/README\.md$)' || true)

          if [ -n "$CODE" ] && [ -z "$DOCS" ]; then
            echo "::error::Application or CI/test infrastructure changed without related documentation."
            echo "::error::Update one of: docs/**, AGENTS.md, README.md, or any module README.md."
            echo "::error::If documentation truly does not need an update, add the 'docs-not-needed' label to this PR."
            echo ""
            echo "Code changes detected:"
            echo "$CODE"
            exit 1
          fi

          echo "Docs check passed."
