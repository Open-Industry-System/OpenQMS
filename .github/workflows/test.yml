name: Test OpenQMS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      OPENQMS_TEST_ARTIFACTS: ${{ github.workspace }}/ci-safe/sdk-checks
      LLM_PROVIDER: ""
      LLM_API_KEY: ""
      LLM_BASE_URL: ""
      EMBEDDING_PROVIDER: ""
      EMBEDDING_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up SDK Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install SDK developer tools
        env:
          LLM_PROVIDER: ""
          LLM_API_KEY: ""
          LLM_BASE_URL: ""
          EMBEDDING_PROVIDER: ""
          EMBEDDING_API_KEY: ""
        run: python -m pip install pytest setuptools==79.0.1

      - name: Run SDK checks
        env:
          LLM_PROVIDER: ""
          LLM_API_KEY: ""
          LLM_BASE_URL: ""
          EMBEDDING_PROVIDER: ""
          EMBEDDING_API_KEY: ""
        run: make check-sdk SDK_PYTHON_BIN=python

      - name: Upload SDK safe receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-checks-${{ matrix.python-version }}-evidence
          path: |
            ${{ env.OPENQMS_TEST_ARTIFACTS }}/sdk/**/*-receipt.json
            ${{ env.OPENQMS_TEST_ARTIFACTS }}/sdk/**/*-filtered.log
          if-no-files-found: error

  backend-route:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.route.outputs.docs_only }}
    env:
      LLM_PROVIDER: ""
      LLM_API_KEY: ""
      LLM_BASE_URL: ""
      EMBEDDING_PROVIDER: ""
      EMBEDDING_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify complete PR using trusted base policy
        id: route
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REQUIRE_PREVIEW_RECEIPTS: ${{ vars.ORACLE_AUTODEPLOY_ENABLED == 'true' && vars.ORACLE_PREVIEW_ENABLED == 'true' }}
        run: |
          set -euo pipefail
          # Main pushes always run the full backend; no PR policy is needed.
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
            echo 'Backend routing: full backend (main push).' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${REQUIRE_PREVIEW_RECEIPTS:-false}" = true ]; then
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
            echo 'Backend routing: full backend (preview publication requires API receipts).' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          # Bootstrap rollout: bases predating this policy cannot take a shortcut.
          if ! git cat-file -e "$BASE_SHA:scripts/ci/backend_route.py"; then
            echo 'docs_only=false' >> "$GITHUB_OUTPUT"
            echo 'Backend routing: full backend (trusted base policy not available).' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git show "$BASE_SHA:scripts/ci/backend_route.py" > "$RUNNER_TEMP/backend-route.py"
          python "$RUNNER_TEMP/backend-route.py" classify

  backend-full:
    needs: [backend-route]
    if: ${{ always() && !cancelled() && needs.backend-route.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    env:
      OPENQMS_TEST_ARTIFACTS: ${{ github.workspace }}/ci-safe/backend-full
      OPENQMS_CI_SHA: ${{ github.sha }}
      LLM_PROVIDER: ""
      LLM_API_KEY: ""
      LLM_BASE_URL: ""
      EMBEDDING_PROVIDER: ""
      EMBEDDING_API_KEY: ""
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: qms
          POSTGRES_PASSWORD: qms_dev_2026
          POSTGRES_DB: qms_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --label openqms.ci.run=${{ github.run_id }}
          --label openqms.ci.attempt=${{ github.run_attempt }}
          --label openqms.ci.job=backend-full
        ports:
          - 5432/tcp

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            sdk/python/pyproject.toml
            .github/workflows/test.yml

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Developer build tool, not a backend or SDK runtime dependency.
      - name: Install SDK developer build tools
        env:
          LLM_PROVIDER: ""
          LLM_API_KEY: ""
          LLM_BASE_URL: ""
          EMBEDDING_PROVIDER: ""
          EMBEDDING_API_KEY: ""
        run: python -m pip install setuptools==79.0.1

      - name: Run manual tests
        env:
          SECRET_KEY: test-secret-key-for-ci-only
        run: |
          cd backend
          PYTHONPATH=. python app/test_schema.py
          PYTHONPATH=. python app/test_spc_engine.py

      - name: Run deterministic backend acceptance
        env:
          SECRET_KEY: test-secret-key-for-ci-only
          LLM_PROVIDER: ""
          LLM_API_KEY: ""
          LLM_BASE_URL: ""
          EMBEDDING_PROVIDER: ""
          EMBEDDING_API_KEY: ""
          PG15_CONTAINER: ${{ job.services.postgres.id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_JOB: backend-full
          TEST_DATABASE_URL: postgresql+asyncpg://qms:qms_dev_2026@localhost:${{ job.services.postgres.ports['5432'] }}/qms_test
        run: make check-backend SDK_PYTHON_BIN=python

      - name: D8 doc-gate preflight (against migrated test DB)
        # A clean migrated CI DB must report no broken CP lineage. Deployment
        # gating remains the explicit target DATABASE_URL command documented in
        # docs/deployment.md; this check never reads a local environment file.
        env:
          SECRET_KEY: test-secret-key-for-ci-only
          LLM_PROVIDER: ""
          LLM_API_KEY: ""
          LLM_BASE_URL: ""
          EMBEDDING_PROVIDER: ""
          EMBEDDING_API_KEY: ""
          PG15_CONTAINER: ${{ job.services.postgres.id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_JOB: backend-full
          DATABASE_URL: postgresql+asyncpg://qms:qms_dev_2026@localhost:${{ job.services.postgres.ports['5432'] }}/qms_test
          TEST_DATABASE_URL: postgresql+asyncpg://qms:qms_dev_2026@localhost:${{ job.services.postgres.ports['5432'] }}/qms_test
        run: |
          cd backend
          PYTHONPATH=. python -m app.services.capa_doc_gate_preflight

      - name: Run engine import checks
        env:
          SECRET_KEY: test-secret-key-for-ci-only
        run: |
          cd backend
          PYTHONPATH=. python -c "
          engines = [
              'app.services.spc_calculation_engine',
              'app.services.aql_engine',
              'app.services.grr_engine',
              'app.services.bias_engine',
              'app.services.linearity_engine',
              'app.services.stability_engine',
              'app.services.attribute_engine',
              'app.services.diff_engine',
          ]
          for m in engines:
              __import__(m)
              print(f'{m}: OK')
          print('All engine modules imported successfully')
          "

      - name: Upload actual safe receipts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests-evidence
          path: |
            ${{ env.OPENQMS_TEST_ARTIFACTS }}/*-receipt.json
            ${{ env.OPENQMS_TEST_ARTIFACTS }}/*.log
          if-no-files-found: error

  backend-tests:
    runs-on: ubuntu-latest
    needs: [backend-route, backend-full]
    if: always()
    env:
      LLM_PROVIDER: ""
      LLM_API_KEY: ""
      LLM_BASE_URL: ""
      EMBEDDING_PROVIDER: ""
      EMBEDDING_API_KEY: ""
    steps:
      - name: Require the selected backend result
        env:
          ROUTE_RESULT: ${{ needs.backend-route.result }}
          DOCS_ONLY: ${{ needs.backend-route.outputs.docs_only }}
          BACKEND_RESULT: ${{ needs.backend-full.result }}
        run: |
          set -euo pipefail
          echo "Backend routing=$ROUTE_RESULT docs_only=$DOCS_ONLY backend=$BACKEND_RESULT" >> "$GITHUB_STEP_SUMMARY"
          [ "$ROUTE_RESULT" = success ] || exit 1
          if [ "$DOCS_ONLY" = true ]; then
            [ "$BACKEND_RESULT" = skipped ] || exit 1
          elif [ "$DOCS_ONLY" = false ]; then
            [ "$BACKEND_RESULT" = success ] || exit 1
          else
            exit 1
          fi

  frontend-checks:
    runs-on: ubuntu-latest
    env:
      OPENQMS_TEST_ARTIFACTS: ${{ github.workspace }}/ci-safe/frontend-checks
      OPENQMS_CI_SHA: ${{ github.sha }}
      LLM_PROVIDER: ""
      LLM_API_KEY: ""
      LLM_BASE_URL: ""
      EMBEDDING_PROVIDER: ""
      EMBEDDING_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Validate lockfile and install dependencies
        run: |
          cd frontend
          if [ ! -f package-lock.json ]; then
            echo "frontend lockfile package-lock.json is required for reproducible CI" >&2
            exit 1
          fi
          npm ci

      - name: TypeScript check
        run: |
          cd backend
          PYTHONPATH=. python3 -m tests.ci.acceptance_evidence frontend tsc

      - name: Build check
        run: |
          cd backend
          PYTHONPATH=. python3 -m tests.ci.acceptance_evidence frontend build

      - name: Upload actual safe receipts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-checks-evidence
          path: |
            ${{ env.OPENQMS_TEST_ARTIFACTS }}/*-receipt.json
            ${{ env.OPENQMS_TEST_ARTIFACTS }}/*.log
          if-no-files-found: error

  browser-protection:
    runs-on: ubuntu-24.04
    env:
      OPENQMS_TEST_ARTIFACTS: ${{ github.workspace }}/ci-safe/browser-protection
      OPENQMS_CI_SHA: ${{ github.sha }}
      LLM_PROVIDER: ""
      LLM_API_KEY: ""
      LLM_BASE_URL: ""
      EMBEDDING_PROVIDER: ""
      EMBEDDING_API_KEY: ""
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: qms
          POSTGRES_PASSWORD: qms_dev_2026
          POSTGRES_DB: qms_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --label openqms.ci.run=${{ github.run_id }}
          --label openqms.ci.attempt=${{ github.run_attempt }}
          --label openqms.ci.job=browser-protection
        ports:
          - 5432/tcp
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          if [ ! -f package-lock.json ]; then
            echo "frontend package-lock.json is required for browser protection" >&2
            exit 1
          fi
          npm ci

      - name: Install Chromium
        run: |
          cd frontend
          npx --no-install playwright install --with-deps chromium

      - name: Prepare verified browser database
        env:
          SECRET_KEY: test-secret-key-for-ci-only
          LLM_PROVIDER: ""
          LLM_API_KEY: ""
          LLM_BASE_URL: ""
          EMBEDDING_PROVIDER: ""
          EMBEDDING_API_KEY: ""
          PG15_CONTAINER: ${{ job.services.postgres.id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_JOB: browser-protection
          TEST_DATABASE_URL: postgresql+asyncpg://qms:qms_dev_2026@localhost:${{ job.services.postgres.ports['5432'] }}/qms_test
        run: |
          cd backend
          PYTHONPATH=. python -m tests.ci.prepare_database

      - name: Run deterministic browser protection
        env:
          SECRET_KEY: test-secret-key-for-ci-only
          LLM_PROVIDER: ""
          LLM_API_KEY: ""
          LLM_BASE_URL: ""
          EMBEDDING_PROVIDER: ""
          EMBEDDING_API_KEY: ""
          PG15_CONTAINER: ${{ job.services.postgres.id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_JOB: browser-protection
          TEST_DATABASE_URL: postgresql+asyncpg://qms:qms_dev_2026@localhost:${{ job.services.postgres.ports['5432'] }}/qms_test
        run: make check-browser

      - name: Upload actual safe receipts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-protection-evidence
          path: |
            ${{ env.OPENQMS_TEST_ARTIFACTS }}/*-receipt.json
            ${{ env.OPENQMS_TEST_ARTIFACTS }}/*.log
          if-no-files-found: error

  docs-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      LLM_PROVIDER: ""
      LLM_API_KEY: ""
      LLM_BASE_URL: ""
      EMBEDDING_PROVIDER: ""
      EMBEDDING_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify docs updated alongside code changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          if echo "$LABELS" | grep -q '"docs-not-needed"'; then
            echo "PR has 'docs-not-needed' label — skipping docs check."
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED"
          echo "---"

          CODE=$(echo "$CHANGED" | grep -E '^(backend/app/|frontend/src/|docker-compose\.ya?ml$|(^|.*/)Dockerfile($|\..*)|\.github/workflows/|Makefile$|backend/tests/|sdk/|frontend/e2e/|frontend/.*playwright.*\.ts$)' || true)
          DOCS=$(echo "$CHANGED" | grep -E '^(docs/|AGENTS\.md$|README\.md$|.*/README\.md$)' || true)

          if [ -n "$CODE" ] && [ -z "$DOCS" ]; then
            echo "::error::Application or CI/test infrastructure changed without related documentation."
            echo "::error::Update one of: docs/**, AGENTS.md, README.md, or any module README.md."
            echo "::error::If documentation truly does not need an update, add the 'docs-not-needed' label to this PR."
            echo ""
            echo "Code changes detected:"
            echo "$CODE"
            exit 1
          fi

          echo "Docs check passed."

  oracle-automation-checks:
    runs-on: ubuntu-24.04
    env:
      LLM_PROVIDER: ""
      LLM_API_KEY: ""
      LLM_BASE_URL: ""
      EMBEDDING_PROVIDER: ""
      EMBEDDING_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Oracle automation test dependencies
        run: python -m pip install pytest PyYAML==6.0.3
      - run: python -m pytest -q tests
