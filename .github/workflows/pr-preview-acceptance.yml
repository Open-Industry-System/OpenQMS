name: PR preview acceptance

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [main]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [Oracle deployment]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: read
  actions: read
  statuses: write

concurrency:
  group: pr-preview-acceptance
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request && github.event.sender.login != 'github-actions[bot]')
    runs-on: ubuntu-24.04
    steps:
      # Privileged metadata check: never check out or execute candidate PR code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate plans and human acceptance for open PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE_INDEPENDENT_REVIEWER: 'false'
        run: python3 scripts/pr-preview-acceptance.py
